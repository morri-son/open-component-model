# Product B: "frontend-service" — product API layer (RGD) with a dependency
# on a backend endpoint (backendRef). Minted kind: FrontendService.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: frontend-service
spec:
  schema:
    apiVersion: v1alpha1
    kind: FrontendService
    spec:
      image: string | default="nginx:1.27-alpine"
      port: integer | default=8081
      # coordinates of a BackendService, e.g. "backend.default.svc:8080".
      # Required in intent; the empty default keeps the CRD lenient so a
      # deliberately misconfigured instance is still accepted by the API.
      backendRef: string | default=""
    status:
      ready: ${deployment.status.availableReplicas == 1}
  resources:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: ${schema.metadata.name}
          template:
            metadata:
              labels:
                app: ${schema.metadata.name}
            spec:
              containers:
                - name: frontend
                  image: ${schema.spec.image}
                  env:
                    - name: BACKEND_REF
                      value: ${schema.spec.backendRef}
                  ports:
                    - containerPort: ${schema.spec.port}
      readyWhen:
        - ${deployment.status.availableReplicas == 1}
