# Product A: "backend-service" — the product API layer (RGD).
# Minted kind: BackendService (namespaced). Users of the product only ever
# create BackendService CRs; the RGD expands each into Deployment + Service
# and publishes a computed endpoint + readiness in status.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: backend-service
spec:
  schema:
    apiVersion: v1alpha1
    kind: BackendService
    spec:
      image: string | default="nginx:1.27-alpine"
      # integer (not string): Deployment containerPort / Service port are
      # int-typed fields; kro CEL does not auto-convert strings to ints.
      port: integer | default=8080
      hostname: string | default="backend"
    status:
      # computed coordinates other layers can consume via CEL
      endpoint: ${schema.spec.hostname}.${schema.metadata.namespace}.svc:${string(schema.spec.port)}
      ready: ${deployment.status.availableReplicas == 1}
  resources:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: ${schema.metadata.name}
          template:
            metadata:
              labels:
                app: ${schema.metadata.name}
            spec:
              containers:
                - name: backend
                  image: ${schema.spec.image}
                  ports:
                    - containerPort: ${schema.spec.port}
      readyWhen:
        - ${deployment.status.availableReplicas == 1}
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}
        spec:
          selector:
            app: ${schema.metadata.name}
          ports:
            - name: http
              port: ${schema.spec.port}
              targetPort: ${schema.spec.port}
